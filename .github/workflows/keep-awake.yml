name: keep database awake

# Supabase pauses free projects after about a week without use, which takes the site down for testers.
# One small database read a day counts as use. It reads only the migration history (no user data),
# with the same secrets the database workflow uses. A failed run emails the repo owner: the early warning.
on:
  schedule:
    - cron: "17 6 * * *" # every day 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: drepfivmsbwysryvpjlm
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Read the migration history from the live database
        run: |
          for attempt in 1 2 3; do
            if supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" \
               && supabase migration list --password "$SUPABASE_DB_PASSWORD"; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The database did not answer. It may be paused: open supabase.com, the shortlist project, and click Restore project."
          exit 1
