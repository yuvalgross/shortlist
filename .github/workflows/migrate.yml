name: database

# Applies new files in supabase/migrations to the live Supabase project when they reach main.
# Merging a pull request is the approval: the same migrations have already passed the database tests in CI.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/migrate.yml"]
  workflow_dispatch:

concurrency:
  group: live-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: drepfivmsbwysryvpjlm
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set in the repository secrets. Skipping; apply new migrations in the Supabase SQL editor until they are added."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.121.0

      - name: Link the project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # One time history cleanup, safe to repeat: the first migrations were applied by hand or under other
      # version numbers, so the live history is aligned with the file names before pushing.
      - name: Align migration history
        if: steps.secrets.outputs.ready == 'true'
        run: |
          supabase migration repair --status reverted 20261016121904 20261016121937 20261016121946 20261016122012 --password "$SUPABASE_DB_PASSWORD" || true
          supabase migration repair --status applied 20261016000001 20261016000002 20261016000003 20261016000004 20261018000001 20261018000002 20261018000003 --password "$SUPABASE_DB_PASSWORD"

      - name: Show what will run
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
