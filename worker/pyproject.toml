[project]
name = "shortlist-worker"
version = "0.1.0"
description = "Background worker: job sourcing, scoring, CV tailoring and digests"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shortlist-worker = "shortlist_worker.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shortlist_worker*"]
